[project]
name = "airwave-discovery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "soundfile==0.14.0",
    "soxr==1.1.0",
    "uvicorn==0.54.0",
    "yt-dlp==2026.10.21",
    "ytmusicapi==1.12.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: talks to real music services (run with -m live)"]
addopts = "-m 'not live'"
